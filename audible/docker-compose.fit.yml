services:
  audible-app-proxy:
    image: fit-proxy:latest
    environment:
    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=audible-app
    - PROXY_HOST=0.0.0.0:5000
    - PROXY_TARGET=http://audible-app-real:5000
    hostname: audible-app
    ports:
    - 5000:5000
  audible-app-real:
    build:
      context: ../
      dockerfile: ./Dockerfile.python.service
      args:
        benchmark: audible
        service: audible-app
    hostname: audible-app-real
    environment:
    - OTEL_SERVICE_NAME=audible-app
    - OTEL_TRACES_EXPORTER=otlp
    - OTEL_BSP_SCHEDULE_DELAY=1
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  content-delivery-engine-proxy:
