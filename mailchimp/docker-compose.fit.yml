services:
  load-balancer-proxy:
    image: fit-proxy:latest
    environment:
    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=load-balancer
    - PROXY_HOST=0.0.0.0:5000
    - PROXY_TARGET=http://load-balancer-real:5000
    hostname: load-balancer
    ports:
    - 5000:5000
  load-balancer-real:
    build:
      context: ../
      dockerfile: ./Dockerfile.python.service
      args:
        benchmark: mailchimp
        service: load-balancer
    hostname: load-balancer-real
    environment:
    - OTEL_SERVICE_NAME=load-balancer
    - OTEL_TRACES_EXPORTER=otlp
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  app-server-proxy:
    image: fit-proxy:latest
    environment:
    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=app-server
    - PROXY_HOST=0.0.0.0:5001
    - PROXY_TARGET=http://app-server-real:5001
    hostname: app-server
    ports:
    - 5001:5001
  app-server-real:
    build:
      context: ../
      dockerfile: ./Dockerfile.python.service
      args:
        benchmark: mailchimp
        service: app-server
    hostname: app-server-real
    environment:
    - OTEL_SERVICE_NAME=app-server
    - OTEL_TRACES_EXPORTER=otlp
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  requestmapper-proxy:
    image: fit-proxy:latest
    environment:
    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=requestmapper
