    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=db-secondary
    - PROXY_HOST=0.0.0.0:5004
    - PROXY_TARGET=http://db-secondary-real:5004
    hostname: db-secondary
    ports:
