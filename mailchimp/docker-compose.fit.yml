    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
    - 16686:16686
    environment:
    - COLLECTOR_OTLP_ENABLED=true
  orchestrator:
    image: fit-orchestrator:latest
    ports:
    - 6050:5000
    environment:
    - PROXY_LIST=load-balancer:8050,app-server:8050,requestmapper:8050,db-primary:8050,db-secondary:8050
