    - PROXY_TARGET=http://requestmapper-real:5002
    hostname: requestmapper
    ports:
    - 5002:5002
  requestmapper-real:
    build:
      context: ../
      dockerfile: ./Dockerfile.python.service
      args:
        benchmark: mailchimp
        service: requestmapper
    hostname: requestmapper-real
    environment:
    - OTEL_SERVICE_NAME=requestmapper
    - OTEL_TRACES_EXPORTER=otlp
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  db-primary-proxy:
    image: fit-proxy:latest
    environment:
    - ORCHESTRATOR_HOST=orchestrator:5000
    - CONTROLLER_PORT=8050
    - SERVICE_NAME=db-primary
    - PROXY_HOST=0.0.0.0:5003
    - PROXY_TARGET=http://db-primary-real:5003
    hostname: db-primary
    ports:
    - 5003:5003
  db-primary-real:
    build:
      context: ../
      dockerfile: ./Dockerfile.python.service
      args:
        benchmark: mailchimp
        service: db-primary
    hostname: db-primary-real
    environment:
    - OTEL_SERVICE_NAME=db-primary
    - OTEL_TRACES_EXPORTER=otlp
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - FLASK_DEBUG=1
    - RUNNING_IN_DOCKER=1
  db-secondary-proxy:
    image: fit-proxy:latest
