            context: '../'
            dockerfile: './Dockerfile.python.service'
            args:
                benchmark: netflix
                service: api-gateway
        environment:
            - FLASK_DEBUG=1
            - RUNNING_IN_DOCKER=1
            - OTEL_SERVICE_NAME=api-gateway
            - OTEL_TRACES_EXPORTER=otlp
            - OTEL_BSP_SCHEDULE_DELAY=1
            - NETFLIX_FAULTS=1
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
        ports:
            - "5001:5001"

    bookmarks-proxy:
