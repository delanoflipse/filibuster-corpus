version: '3'

services:
    # system services
    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        command: --config=/otel-config.yaml
        volumes:
            - ../config/otel-collector/otel-config.yaml:/otel-config.yaml
        depends_on:
            - jaeger
            - orchestrator

    jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
            - 8686:16686
        environment:
            - COLLECTOR_OTLP_ENABLED=true

    orchestrator:
        image: fit-otel-orchestrator:latest
        ports:
            - "6050:5000"
        environment:
            - PROXY_LIST=api-gateway:8050,bookmarks:8050,telemetry:8050,trending:8050,my-list:8050,user-recommendations:8050,global-recommendations:8050,ratings:8050,user-profile:8050,mobile-client:8050

    # services
    mobile-client-proxy:
        image: fit-proxy:latest
        hostname: mobile-client
        environment:
            - PROXY_HOST=0.0.0.0:5000
            - PROXY_TARGET=http://mobile-client-real:5000
            - ORCHESTRATOR_HOST=orchestrator:5000
            - CONTROLLER_PORT=8050
        ports:
            - "5000:5000"
    mobile-client-real:
        build:
            context: '../'
            dockerfile: './Dockerfile.python.service'
            args:
                benchmark: netflix
                service: mobile-client
        environment:
            - FLASK_DEBUG=1
            - RUNNING_IN_DOCKER=1
            - OTEL_SERVICE_NAME=mobile-client
            - OTEL_TRACES_EXPORTER=otlp
            - OTEL_BSP_SCHEDULE_DELAY=1
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317

    api-gateway-proxy:
        image: fit-proxy:latest
        hostname: api-gateway
        environment:
            - PROXY_HOST=0.0.0.0:5001
            - PROXY_TARGET=http://api-gateway-real:5001
            - ORCHESTRATOR_HOST=orchestrator:5000
            - CONTROLLER_PORT=8050
    api-gateway-real:
